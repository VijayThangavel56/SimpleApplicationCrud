name: Angular + .NET CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # ==========================================
  # Angular - Build & Deploy to GitHub Pages
  # ==========================================
  angular-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Angular dependencies
        working-directory: sampleapplication.client
        run: npm install

      - name: Build Angular
        working-directory: sampleapplication.client
        run: npm run build -- --base-href /SimpleApplicationCrud/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Angular artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sampleapplication.client/dist

      - name: Deploy Angular to GitHub Pages
        uses: actions/deploy-pages@v4


  # ==========================================
  # .NET - Build & Test
  # ==========================================
  dotnet-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore ./SampleApplication.slnx

      - name: Build .NET
        run: dotnet build ./SampleApplication.slnx --configuration Release --no-restore

      - name: Run .NET tests
        run: dotnet test ./SampleApplication.slnx --configuration Release --no-build

      - name: Publish .NET
        run: dotnet publish ./SampleApplication.slnx --configuration Release --output ./publish

      - name: Upload .NET artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-api
          path: ./publish
