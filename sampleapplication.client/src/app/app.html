<div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" routerLink="/employees" aria-label="PeopleSpace home">
            <span class="brand-mark">p</span>
            <span class="brand-name">people<span>space</span></span>
        </a>

        <p class="nav-caption">WORKSPACE</p>
        <nav class="primary-nav">
            <a routerLink="/employees" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                <span class="nav-symbol" aria-hidden="true">▦</span>
                <span>Directory</span>
            </a>
            <a routerLink="/employees/new" routerLinkActive="active">
                <span class="nav-symbol" aria-hidden="true">＋</span>
                <span>Add employee</span>
            </a>
        </nav>

        <div class="sidebar-bottom">
            <div class="workspace-card">
                <span class="workspace-indicator" aria-hidden="true"></span>
                <div><strong>People team</strong><small>Company workspace</small></div>
            </div>
            <div class="sidebar-footer">A better place to work.</div>
        </div>
    </aside>

    <div class="main-column">
        <header class="topbar">
            <div class="breadcrumb"><span>Workspace</span><span class="breadcrumb-divider">/</span><strong>People</strong></div>
            <div class="user-chip" aria-label="Signed in as Alex Morgan">
                <span class="user-avatar">AM</span>
                <span class="user-name">Alex Morgan</span>
                <span class="user-chevron" aria-hidden="true">⌄</span>
            </div>
        </header>

        <main class="page-content">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
